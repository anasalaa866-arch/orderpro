<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f1f1f2">
<title>CAFELAX &middot; Price Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f1f2; --card:#ffffff; --ink:#15151a; --muted:#8a8a93;
  --line:#e6e6e9; --pill:#ececef; --pill-ink:#6f6f78;
  --bad:#fde9e8; --bad-ink:#d7372a;
  --blue:#2563eb; --black:#000000;
  --r-card:28px; --r-ctl:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding:24px; overflow:hidden; cursor:default;
  -webkit-user-select:none; user-select:none;
}
.screen{display:none; width:100%; animation:in .22s ease both}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ─────────── شاشة المسح ─────────── */
#scan{max-width:430px;margin:0 auto}
.card{
  background:var(--card); border-radius:var(--r-card);
  padding:40px 32px 34px; text-align:center;
  box-shadow:0 1px 2px rgba(16,16,24,.04), 0 12px 34px rgba(16,16,24,.07);
}
.logo{width:186px;max-width:62%;height:auto;display:block;margin:0 auto}
h1{font-size:34px;font-weight:700;letter-spacing:-.9px;margin:22px 0 0;line-height:1.1}
.pill{
  display:inline-block;margin:16px 0 22px;padding:9px 20px;border-radius:999px;
  background:var(--pill); color:var(--pill-ink);
  font-size:14.5px; font-weight:500; letter-spacing:-.1px;
  transition:background .18s, color .18s;
}
.pill.bad{background:var(--bad);color:var(--bad-ink);font-weight:600}
input{
  width:100%; padding:16px 18px; text-align:center;
  background:#fff; border:1.5px solid var(--line); border-radius:12px;
  font-family:inherit; font-size:16px; font-weight:500; color:var(--ink);
  outline:none; transition:border-color .18s, box-shadow .18s;
}
input::placeholder{color:#b4b4bc;font-weight:400}
input:focus{border-color:#cfcfd6; box-shadow:0 0 0 4px rgba(37,99,235,.08)}
.btn{
  width:100%; margin-top:14px; padding:17px; border:0; border-radius:var(--r-ctl);
  background:var(--black); color:#fff;
  font-family:inherit; font-size:16px; font-weight:600; letter-spacing:-.2px;
  cursor:pointer; transition:transform .12s, opacity .18s;
}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.5;cursor:default}
.hint{margin-top:26px;text-align:center;color:var(--blue);line-height:1}
.hint .chev{display:block;font-size:30px;font-weight:700;margin-bottom:2px;animation:bob 1.7s ease-in-out infinite}
.hint .txt{font-size:13px;font-weight:700;letter-spacing:1.6px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* ─────────── شاشة النتيجة ─────────── */
#res{max-width:620px;margin:0 auto;text-align:center}
#res .logo{width:142px;margin-bottom:26px}
.shot{
  width:300px;height:300px;margin:0 auto 24px;
  display:flex;align-items:center;justify-content:center;
}
.shot img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.shot .none{font-size:92px;opacity:.16}
.ttl{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.32;margin:0 auto;max-width:520px}
.sub{margin-top:6px;font-size:14px;color:var(--muted);font-weight:500}
.was{
  margin-top:14px;font-size:22px;font-weight:600;color:var(--muted);
  text-decoration:line-through;text-decoration-thickness:2px;
}
.price{
  margin-top:10px;font-size:68px;font-weight:700;color:var(--blue);
  letter-spacing:-2.4px;line-height:1;
}
.price .cur{font-size:40px;font-weight:600;letter-spacing:-1px;margin-left:6px}
.tag{
  display:inline-block;margin-top:14px;padding:7px 16px;border-radius:999px;
  background:var(--bad);color:var(--bad-ink);font-size:13px;font-weight:600;
}
#res .pill{margin:26px 0 16px}
#res .btn{max-width:300px;margin-left:auto;margin-right:auto;display:block}

/* شاشات كبيرة معلّقة في المحل */
@media (min-height:900px){
  h1{font-size:40px}
  .shot{width:360px;height:360px}
  .price{font-size:84px}
  .ttl{font-size:30px}
}
@media (max-width:420px){
  .card{padding:32px 22px 28px}
  h1{font-size:29px}
  .shot{width:230px;height:230px}
  .price{font-size:56px}
  .ttl{font-size:22px}
}

/* ─────────── إعداد الجهاز ─────────── */
#setup{max-width:430px;margin:0 auto}
#setup .card{text-align:left}
#setup h1{font-size:24px;text-align:center}
#setup p{color:var(--muted);font-size:14px;line-height:1.6;margin:14px 0 18px;text-align:center}
#setup input{text-align:left;direction:ltr;font-size:14px;margin-bottom:10px}
.err{margin-top:12px;color:var(--bad-ink);font-size:13.5px;font-weight:600;text-align:center;min-height:20px}
</style>
</head>
<body>

<!-- ══════════ المسح ══════════ -->
<div class="screen on" id="scan">
  <div class="card">
    <img class="logo" id="lg1" alt="CAFELAX">
    <h1>Price Checker</h1>
    <div class="pill" id="pill">Ready to Scan</div>
    <input id="bc" type="text" inputmode="none" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false"
           placeholder="Scan or type barcode">
    <button class="btn" id="go">Check Price</button>
  </div>
  <div class="hint"><span class="chev">&#8964;</span><span class="txt">SCAN DOWN HERE</span></div>
</div>

<!-- ══════════ النتيجة ══════════ -->
<div class="screen" id="res">
  <img class="logo" id="lg2" alt="CAFELAX">
  <div class="shot" id="shot"></div>
  <div class="ttl" id="r-ttl"></div>
  <div class="sub" id="r-sub"></div>
  <div class="was" id="r-was" style="display:none"></div>
  <div class="price" id="r-price"></div>
  <div class="tag" id="r-tag" style="display:none"></div>
  <div class="pill" id="r-count"></div>
  <button class="btn" id="back">BACK NOW</button>
</div>

<!-- ══════════ الإعداد ══════════ -->
<div class="screen" id="setup">
  <div class="card">
    <img class="logo" id="lg3" alt="CAFELAX" style="width:150px">
    <h1>Setup</h1>
    <p>الشاشة دي محتاجة توكن الجهاز.<br>اعمله من أوردر برو &rarr; الإعدادات &rarr; شاشات الأسعار.</p>
    <input id="s-api" placeholder="https://…railway.app" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false" name="pc-server-url">
    <input id="s-tok" placeholder="الصق رابط الشاشة أو التوكن" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false" name="pc-device-token">
    <button class="btn" id="s-go">Save</button>
    <div class="err" id="s-err"></div>
  </div>
</div>

var DEFAULT_API = 'https://orderpro-backend-production.up.railway.app';
var HOLD_SEC    = 8;   // قد إيه النتيجة تفضل على الشاشة
var MISS_SEC    = 4;   // قد إيه رسالة "مش موجود" تفضل

var $ = function(id){ return document.getElementById(id); };

// ── التوكن ──
// بييجي مرة واحدة في الـ URL (?t=pcd_…) وبعدين بيتخزّن على الجهاز،
// والـ URL بيتنضّف عشان التوكن ما يفضلش باين في شريط العنوان.
function qs(k){
  var m = new RegExp('[?&]' + k + '=([^&]+)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : '';
}
var API = '', TOK = '';
(function boot(){
  var qa = qs('api'), qt = qs('t');
  if(qt){ try{ localStorage.setItem('pc_token', qt); }catch(e){} }
  if(qa && !/github\.io|price-checker/i.test(qa)){ try{ localStorage.setItem('pc_api', qa); }catch(e){} }
  if(qt || qa){ try{ history.replaceState(null, '', location.pathname); }catch(e){} }
  try{
    TOK = localStorage.getItem('pc_token') || '';
    API = localStorage.getItem('pc_api') || DEFAULT_API;
  }catch(e){ TOK = qt; API = qa || DEFAULT_API; }
  if(!TOK) show('setup');
})();

function show(id){
  ['scan','res','setup'].forEach(function(s){
    $(s).classList.toggle('on', s === id);
  });
  if(id === 'scan') focus();
}

// ── الإعداد اليدوي ──
$('s-api').value = API;
// لو لصق الرابط كله بدل التوكن، نطلّع منه التوكن والسيرفر
function pcParse(v){
  v = String(v || '').trim();
  var m = /[?&]t=(pcd_[A-Za-z0-9]+)/.exec(v) || /\b(pcd_[A-Za-z0-9]+)\b/.exec(v);
  var out = { tok: m ? m[1] : '' };
  var a = /[?&]api=([^&\s]+)/.exec(v);
  if(a){ try{ out.api = decodeURIComponent(a[1]); }catch(e){ out.api = a[1]; } }
  return out;
}

$('s-go').onclick = function(){
  var raw = $('s-tok').value;
  var p   = pcParse(raw);
  var t   = p.tok;
  // الرابط الملصوق بيجيب السيرفر معاه — ولا نحط عنوان الصفحة نفسها بالغلط
  var a = (p.api || $('s-api').value || '').trim().replace(/\/+$/, '');
  if(/github\.io|price-checker/i.test(a)) a = '';
  if(!t){ $('s-err').textContent = 'الصق رابط الشاشة من أوردر برو، أو التوكن اللي بيبدأ بـ pcd_'; return; }
  try{
    localStorage.setItem('pc_token', t);
    localStorage.setItem('pc_api', a || DEFAULT_API);
  }catch(e){ $('s-err').textContent = 'الجهاز مش بيحفظ — افتح الصفحة من غير وضع التصفح الخفي'; return; }
  TOK = t; API = a || DEFAULT_API;
  $('s-api').value = API;
  $('s-err').textContent = '';
  show('scan');
};

// ── الفوكس دايماً على خانة الباركود ──
// الماسح بيكتب الأرقام كأنه كيبورد، فلو الفوكس ضاع المسح بيضيع معاه.
function focus(){
  var el = $('bc');
  if(document.activeElement !== el){ try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); } }
}
$('bc').addEventListener('blur', function(){ setTimeout(focus, 40); });
document.addEventListener('click', function(e){
  if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') focus();
});
document.addEventListener('visibilitychange', function(){ if(!document.hidden) focus(); });
setInterval(function(){ if($('scan').classList.contains('on')) focus(); }, 1500);

// ── الحالة ──
var busy = false, timer = null, tick = null;
function clearTimers(){ clearTimeout(timer); clearInterval(tick); timer = null; tick = null; }

function setPill(txt, bad){
  var p = $('pill');
  p.textContent = txt;
  p.classList.toggle('bad', !!bad);
}
function reset(){
  clearTimers();
  busy = false;
  $('go').disabled = false;
  $('bc').value = '';
  setPill('Ready to Scan', false);
  show('scan');
}

// ── البحث ──
function money(n){
  return Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
}

async function check(){
  var code = $('bc').value.trim();
  if(!code || busy) return;
  busy = true;
  $('go').disabled = true;
  setPill('Checking…', false);
  try{
    var r = await fetch(API + '/api/price-check?barcode=' + encodeURIComponent(code), {
      headers: { Authorization: 'Bearer ' + TOK }, cache: 'no-store'
    });
    if(r.status === 401){ show('setup'); $('s-err').textContent = 'الجهاز مش مفعّل — اعمل توكن جديد'; busy = false; return; }
    var d = await r.json();
    if(!r.ok) throw new Error(d.error || 'خطأ');
    if(d.found) return render(d);
    miss('Product Not Found! ✖');
  }catch(e){
    miss('No Connection ✖');
  }
}

function miss(msg){
  busy = false;
  $('go').disabled = false;
  $('bc').value = '';
  setPill(msg, true);
  focus();
  clearTimers();
  timer = setTimeout(reset, MISS_SEC * 1000);
}

function render(d){
  // لو الصورة مش موجودة أو وقعت، نحط كوب بدل ما تفضل فجوة فاضية
  var shot = $('shot');
  shot.innerHTML = '<div class="none">☕</div>';
  if(d.image){
    var im = new Image();
    im.alt = '';
    im.onload = function(){ shot.innerHTML = ''; shot.appendChild(im); };
    im.src = d.image;
  }
  $('r-ttl').textContent = d.title || '';
  $('r-sub').textContent = d.variant_title || '';
  $('r-sub').style.display = d.variant_title ? '' : 'none';

  if(d.was && d.was > d.price){
    $('r-was').textContent = money(d.was) + ' ' + d.currency;
    $('r-was').style.display = '';
  }else{
    $('r-was').style.display = 'none';
  }

  $('r-price').innerHTML = money(d.price) + '<span class="cur">' + d.currency + '</span>';

  if(d.offer){
    $('r-tag').textContent = 'Special Offer';
    $('r-tag').style.display = '';
  }else{
    $('r-tag').style.display = 'none';
  }

  show('res');
  busy = false;
  $('go').disabled = false;
  $('bc').value = '';

  // عدّاد الرجوع — بيرجّع الشاشة لوحدها عشان محدش يسيبها على منتج
  clearTimers();
  var left = HOLD_SEC;
  $('r-count').textContent = 'Closing in ' + left + ' s';
  tick = setInterval(function(){
    left--;
    if(left <= 0) return reset();
    $('r-count').textContent = 'Closing in ' + left + ' s';
  }, 1000);
}

// ── المدخلات ──
$('go').onclick = check;
$('back').onclick = reset;
$('bc').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); check(); }
});
// أي مسح والشاشة على النتيجة؟ ارجع وابدأ من جديد
document.addEventListener('keydown', function(e){
  if($('res').classList.contains('on') && /^[a-zA-Z0-9]$/.test(e.key)){
    clearTimers();
    show('scan');
    setPill('Ready to Scan', false);
    $('bc').value = e.key;
    e.preventDefault();
  }
});

focus();
</script>
</body>
</html>
